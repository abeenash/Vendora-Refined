services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vendora-app
    container_name: vendora-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    # inside the compose network the database is reachable as "db" on its normal port
    environment:
      DB_HOST: db
      DB_PORT: 5432
    networks:
      - vendora-network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: vendora-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - vendora-network
    depends_on:
      - app

  db:
    image: postgres:16
    container_name: vendora-postgres
    restart: unless-stopped
    # credentials come from .env (DB_DATABASE / DB_USERNAME / DB_PASSWORD), never hardcoded
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vendora}
      POSTGRES_USER: ${DB_USERNAME:-vendora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    # host port 5434 so it doesn't clash with local Postgres (5432) or the AMS container (5433);
    # bound to 127.0.0.1 so only this machine can reach it
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - vendora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vendora-network

networks:
  vendora-network:
    driver: bridge

volumes:
  vendora-pgdata:
    driver: local
