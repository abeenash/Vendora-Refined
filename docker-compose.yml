services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vendora-app
    container_name: vendora-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - vendora-network

  web:
    image: nginx:alpine
    container_name: vendora-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - vendora-network
    depends_on:
      - app

  db:
    image: mysql:9.0
    container_name: vendora-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: Vendora
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - vendora-db-data:/var/lib/mysql
    networks:
      - vendora-network

networks:
  vendora-network:
    driver: bridge

volumes:
  vendora-db-data:
    driver: local
