; Everything in one container: web server, PHP, the scheduler, and a one-off demo check at boot.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The two artisan programs run as the container's own user, like the entrypoint, on purpose:
;  - with `user=www-data` supervisor keeps HOME=/root, and libpq (Postgres over SSL, as on Neon)
;    then fails on "could not open certificate file /root/.postgresql/postgresql.crt: Permission denied"
;  - Render's runtime also refuses to let supervisor signal processes of another user on shutdown
; php-fpm still serves web requests as www-data.

; runs routes/console.php's schedule (hourly demo:refresh --if-stale)
[program:scheduler]
command=php /var/www/html/artisan schedule:work
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; on boot: seed the demo on a brand-new database, or rebuild it if it is from an earlier day.
; Runs in the background so the site is up immediately. Retries a few times in case the
; database is still waking up (Neon suspends when idle). Exits 1 when DEMO_MODE is off.
[program:demo-boot]
command=sh -c 'for try in 1 2 3 4 5; do php /var/www/html/artisan demo:refresh --if-stale && exit 0; echo "demo-boot: attempt $try failed, retrying in 20s" >&2; sleep 20; done; exit 1'
autorestart=false
startsecs=0
exitcodes=0,1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
